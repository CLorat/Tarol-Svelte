name: CI

# Every PR and push runs the whole check list (docs/migration/plan.md, "How a step is done"). Reused by release.yml (step 11).
on:
  push:
    branches: [main, 'ccr-**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # pnpm comes from Node's corepack at the version in package.json "packageManager"; no third-party action.
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # Playwright's browser for the component tests (Vitest browser mode); the version is the one in the lockfile.
      - name: Browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm format:check
      # Before lint: type-aware lint resolves the @clorat/* workspace imports through each package's dist/.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm size
      - run: pnpm check:packages
      - run: pnpm api:check
      - run: pnpm eng:test

  # End-to-end against the backend sample (docs/migration/e2e.md): Tarol-Net at a pinned commit, its Aspire AppHost with
  # PostgreSQL, NATS and Zitadel in Docker, then the contract tests and the Playwright suite of apps/docs.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Tarol-Net #109 (BC-18, the sample's login page) on top of fe0a2bd; the merge commit once it is merged
      TAROL_NET_COMMIT: 08d3c6649607b3a9a49b03c0e90b5a2ab22325b8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: CLorat/Tarol-Net
          ref: ${{ env.TAROL_NET_COMMIT }}
          path: tarol-net
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0, the pin of Tarol-Net's ci.yml
        with:
          global-json-file: tarol-net/global.json

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Build the packages and the sample
        run: |
          pnpm build
          dotnet build tarol-net/samples/Sagas/AppHost

      # one AppHost for both suites (locally, global-setup.ts starts it when TAROL_E2E_URL is not set)
      - name: Start the sample
        run: |
          cd tarol-net/samples/Sagas/AppHost
          # 30-second access tokens (clock skew 0): the e2e's expiry scenario runs; every other one refreshes as it goes
          ARTFLOW_TOKEN_LIFETIME=30s ASPIRE_ALLOW_UNSECURED_TRANSPORT=true DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true \
            ASPNETCORE_URLS=http://localhost:18888 ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL=http://localhost:18890 \
            nohup dotnet bin/Debug/net11.0/ArtFlow.AppHost.dll > "$RUNNER_TEMP/apphost.log" 2>&1 &
          for i in $(seq 120); do curl -sf http://localhost:5080/health/ready > /dev/null && exit 0; sleep 2; done
          tail -50 "$RUNNER_TEMP/apphost.log"; exit 1

      - name: Contract tests (client, codegen, oidc)
        env:
          TAROL_E2E: '1'
        run: npx vitest run packages/tarol-client/test/contract.test.ts packages/tarol-codegen/test/contract.test.ts packages/tarol-oidc/test/contract.test.ts

      - name: End-to-end tests (Playwright)
        env:
          TAROL_E2E_URL: http://localhost:5080
        run: pnpm --filter @clorat/tarol-docs e2e

  # Visual regression (SV-12): every catalogue component × theme × density, in the official Playwright container so the
  # rendering (fonts, anti-aliasing) is the same in every run. Baselines live in apps/docs/e2e/__screenshots__ and are
  # made here only: a missing baseline is written and uploaded as an artifact for the PR to commit; a changed one fails.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Screenshots
        env:
          TAROL_VISUAL: '1'
        run: |
          pnpm --filter "./packages/**" build
          pnpm --filter @clorat/tarol-docs visual --update-snapshots=missing

      - name: Upload new baselines and differences
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual
          path: |
            apps/docs/e2e/__screenshots__
            apps/docs/test-results
          if-no-files-found: ignore
